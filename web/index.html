<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ar学 —— 阿拉伯语单词学习工具，支持间隔重复记忆与多种练习模式。">

  <!-- 主题色（亮/暗）：取自 ColorScheme.fromSeed(StaticsVar.themeList[9] = Colors.cyan) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5FAFC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1416">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ar学">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ar学 — 阿拉伯语单词</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* —— 启动屏（首帧前绘制，内联于 head，无外部资源）—— */
    /* 颜色来源：ColorScheme.fromSeed(seedColor: Colors.cyan /* StaticsVar.themeList[9]，默认 config.theme=9 */)
       light.surface=#F5FAFC onSurface=#171D1E onSurfaceVariant=#3F484A primary=#006876
       dark .surface=#0E1416 onSurface=#DEE3E5 onSurfaceVariant=#BFC8CA primary=#83D3E3 */
    :root {
      --splash-surface: #F5FAFC;
      --splash-text: #171D1E;
      --splash-muted: #3F484A;
      --splash-primary: #006876;
      --splash-ring-track: rgba(23, 29, 30, 0.14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --splash-surface: #0E1416;
        --splash-text: #DEE3E5;
        --splash-muted: #BFC8CA;
        --splash-primary: #83D3E3;
        --splash-ring-track: rgba(222, 227, 229, 0.14);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--splash-surface);
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--splash-surface);
      color: var(--splash-text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      opacity: 1;
      transition: opacity 0.35s ease;
      z-index: 9999;
    }
    #splash.is-done {
      opacity: 0;
      pointer-events: none;
    }
    .splash-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: splash-in 0.5s ease both;
    }
    .splash-icon {
      width: 96px;
      height: 96px;
      border-radius: 24px; /* 对齐 AppRadius.card=25 的观感 */
      object-fit: cover;
    }
    .splash-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0;
    }
    .splash-ring {
      width: 28px;
      height: 28px;
      margin-top: 10px;
      border-radius: 50%;
      border: 2px solid var(--splash-ring-track);
      border-top-color: var(--splash-primary);
      animation: splash-spin 0.9s linear infinite;
    }
    .splash-hint {
      margin: 0;
      font-size: 12px;
      color: var(--splash-muted);
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes splash-in {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-column { animation: none; }
      .splash-ring { animation-duration: 1.6s; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-column">
      <img class="splash-icon" src="icons/Icon-192.png" alt="" width="96" height="96">
      <p class="splash-name">Ar学</p>
      <div class="splash-ring"></div>
      <p class="splash-hint" id="splash-hint">正在加载中…</p>
    </div>
  </div>

  <noscript>本应用需要启用 JavaScript 才能运行。</noscript>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
