name: Flutter Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 计算本次构建的完整版本号：
  # - 推送 tag：直接用 tag（如 v1.2.0 / v1.3.0-rc.1）
  # - 推送 main：下一个补丁版的开发版，如 1.2.1-alpha.37（发布预发布）
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute version
        id: version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          core=${version%%+*}
          build=${version#*+}
          [ "$build" = "$version" ] && build=0
          IFS=. read -r major minor patch <<< "$core"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            app_version="${GITHUB_REF_NAME#v}"
          else
            app_version="$major.$minor.$((patch + 1))-alpha.$GITHUB_RUN_NUMBER"
          fi
          # versionCode 必须随时间递增：tag 发布晚于开发版时也要能覆盖安装，
          # 因此正式版同样叠加 run_number。
          build_number=$((build + GITHUB_RUN_NUMBER))
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "本次构建版本: $app_version ($build_number)"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5' # Android 与其余平台统一到 3.47.x（AGP 9.1.0 / Gradle 9.3.1）
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../release.jks" >> android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release --obfuscate --split-per-abi --split-debug-info=symbols --build-number=${{ needs.prepare.outputs.build_number }} --dart-define=APP_VERSION=${{ needs.prepare.outputs.app_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm-v7a-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      
      - uses: actions/upload-artifact@v7
        with:
          name: android-arm-v8a-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      
      - uses: actions/upload-artifact@v7
        with:
          name: android-x86_64-apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - run: flutter pub get
      - run: flutter build windows --dart-define=APP_VERSION=${{ needs.prepare.outputs.app_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: build/windows/x64/runner/Release

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - run: flutter pub get
      - run: flutter build macos --dart-define=APP_VERSION=${{ needs.prepare.outputs.app_version }}
    
      - name: Post handling
        run: hdiutil create -volname arabic_learning -srcfolder build/macos/Build/Products/Release/arabic_learning.app -ov -format UDZO arabic_learning.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: arabic_learning.dmg

  build-ios:
    name: Build iOS App (unsigned IPA)
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=APP_VERSION=${{ needs.prepare.outputs.app_version }}

      # 无签名 IPA：安装前需自行签名。
      # ipa 必须是「Payload/Runner.app」结构，不能直接压缩 iphoneos 目录。
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: ios-unsigned.ipa

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: flutter build web --release --base-href /arabic_learning/ --dart-define=APP_VERSION=${{ needs.prepare.outputs.app_version }}

      # 上传 Web 构建结果
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web

  deploy-web:
    permissions:
      contents: write
      pages: write
    name: Deploy Flutter Web to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' # 仅 main 分支部署
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # 正文取自 CHANGELOG.md：正式版按 tag 版本找对应段落，预发布取 Unreleased。
      - name: Extract release notes
        run: python3 .github/scripts/changelog_notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - uses: actions/download-artifact@v8
        with:
          name: android-arm-v7a-apk
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: android-arm-v8a-apk
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: android-x86_64-apk
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./windows
      - uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ./macos
      - uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: .
      
      - name: Prepare artifacts
        run: |
          zip -r windows.zip windows/
          zip -r macos.zip macos/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # tag 带 `-`（-alpha/-rc）即预发布，不会成为 /releases/latest
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            app-armeabi-v7a-release.apk
            app-arm64-v8a-release.apk
            app-x86_64-release.apk
            windows.zip
            macos.zip
            ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # main 推送且全部平台构建成功后，自动发一个开发版预发布（tag `v<下一个补丁版>-alpha.<run>`）。
  # 用 GITHUB_TOKEN 建 tag 不会再次触发本工作流。
  publish-prerelease:
    name: Publish Prerelease
    runs-on: ubuntu-latest
    needs: [prepare, build-android, build-windows, build-macos, build-ios]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes
        run: python3 .github/scripts/changelog_notes.py "${TAG}" > release-notes.md

      - uses: actions/download-artifact@v8
        with:
          name: android-arm-v7a-apk
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: android-arm-v8a-apk
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: android-x86_64-apk
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./windows
      - uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ./macos
      - uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: .

      - name: Prepare artifacts
        run: |
          zip -r windows.zip windows/
          zip -r macos.zip macos/

      - name: Create GitHub prerelease
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            app-armeabi-v7a-release.apk \
            app-arm64-v8a-release.apk \
            app-x86_64-release.apk \
            windows.zip \
            macos.zip \
            ios-unsigned.ipa